name: Build CS2 Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-cs2-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator runtime source
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator-app.git winlator-src
          cd winlator-src
          git fetch --depth 1 origin 3981d86efa4f333b2a34a7da8b6521476cd8c8b9
          git checkout 3981d86efa4f333b2a34a7da8b6521476cd8c8b9

      - name: Apply CS2-only launcher patch
        run: python3 android/scripts/patch_winlator.py winlator-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'

      - name: Build installable APK
        working-directory: winlator-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare release asset
        run: |
          cp winlator-src/app/build/outputs/apk/debug/app-debug.apk CS2-Mobile-v0.4.7-alpha.apk
          sha256sum CS2-Mobile-v0.4.7-alpha.apk > CS2-Mobile-v0.4.7-alpha.sha256

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2-Mobile-v0.4.7-alpha
          path: |
            CS2-Mobile-v0.4.7-alpha.apk
            CS2-Mobile-v0.4.7-alpha.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.4.7-alpha'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CS2-Mobile-v0.4.7-alpha.apk CS2-Mobile-v0.4.7-alpha.sha256 --clobber
          else
            gh release create "$TAG" CS2-Mobile-v0.4.7-alpha.apk CS2-Mobile-v0.4.7-alpha.sha256 \
              --title 'CS2 Mobile v0.4.7 alpha' \
              --notes 'Minimal portrait launcher redesign. Removes decorative icons, stage labels and marketing text. Main screen now shows only CS2 Mobile, status, Launch, Controls and Settings. Launcher is forced portrait; only Steam/CS2 runtime uses landscape. Keeps permission onboarding, runtime/bootstrap fixes and customizable touch HUD.'
          fi
