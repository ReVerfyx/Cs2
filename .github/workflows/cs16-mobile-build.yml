name: Build CS16 Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'cs16-mobile-source.zip'
      - '.github/workflows/cs16-mobile-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1' 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Unpack CS16 Mobile source
        run: unzip -q cs16-mobile-source.zip
      - name: Build APK
        working-directory: cs16-mobile
        run: |
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Mobile-APK
          path: cs16-mobile/work/xash3d-fwgs/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
