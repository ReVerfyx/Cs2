// Соль — базовые серверные настройки.
// Плагин сам меняет часть cvar'ов на раунд и возвращает их назад.

hostname "Соль | полный рандом"
sv_cheats 0

mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_freezetime 4
mp_roundtime 2.5
mp_roundtime_defuse 2.5
mp_buytime 25
mp_c4timer 40
mp_give_player_c4 1

sv_gravity 800
sv_friction 5.2
sv_infinite_ammo 0

// Чтобы хаос не заканчивался слишком быстро.
mp_maxrounds 0
mp_timelimit 0
